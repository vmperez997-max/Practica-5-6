[project]
name = "inf8239-u03-generativos"
version = "0.1.0"
description = "LAB10: AE y VAE reproducibles con Fashion-MNIST"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.9,<4", "pandas>=2.2,<3", "requests>=2.32,<3", "streamlit>=1.40,<2", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
cpu = ["tensorflow>=2.18,<2.22"]
gpu = ["tensorflow[and-cuda]>=2.18,<2.22; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8,<9", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "reportlab>=4", "pymupdf>=1.24", "ruff>=0.9,<1"]

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "gpu"}]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inf8239_lab10"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
