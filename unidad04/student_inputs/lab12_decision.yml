tolerance: Recall >= .68 y brechas TPR/FPR <= .16 heredados de la base; soporte n>=30
  y >=10 por clase es propuesta académica, no norma legal.
evidence: reports/lab12/comparison.csv; validation_candidates.csv; fairness_by_group.csv;
